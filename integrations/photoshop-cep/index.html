<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>LIclick Live Texture</h1>
          <p id="connectionCopy">正在连接 LIclick 本地工作区…</p>
        </div>
        <span id="connectionDot" class="status-dot" data-tone="starting"></span>
      </header>
      <section class="bridge-card">
        <span>本地桥接</span><strong id="connectionStatus">连接中</strong>
      </section>
      <section>
        <div class="section-heading">
          <h2>当前纹理会话</h2>
          <button id="syncNow" type="button" disabled>立即同步</button>
        </div>
        <div id="emptyState" class="empty-state">从 LIclick 图层菜单点击“使用 Photoshop 编辑”。</div>
        <div id="sessionList" class="session-list"></div>
      </section>
      <footer><span>CEP 1.1.0</span><span id="lastSync">等待会话</span></footer>
    </main>
    <script src="panel.js"></script>
  </body>
</html>
