<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js"></script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>LIclick Live Texture</h1>
          <p id="connectionCopy">正在连接本地工作区…</p>
        </div>
        <span class="status-dot" id="connectionDot" data-tone="starting"></span>
      </header>
      <section class="connection-card">
        <span>桥接状态</span>
        <strong id="connectionStatus">连接中</strong>
      </section>
      <section>
        <div class="section-heading">
          <h2>当前编辑会话</h2>
          <button id="syncNow" type="button" disabled>立即同步</button>
        </div>
        <div id="emptyState" class="empty-state">
          在 LIclick 图层菜单中选择“使用 Photoshop 编辑”，会话会自动出现在这里。
        </div>
        <div id="sessionList" class="session-list"></div>
      </section>
      <footer>
        <span>插件 1.0.0</span>
        <span id="lastSync">等待会话</span>
      </footer>
    </main>
  </body>
</html>
