apiVersion: apps/v1
kind: Deployment
metadata:
  name: li3d-web
  labels:
    app: li3d
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: li3d
      component: web
  template:
    metadata:
      labels:
        app: li3d
        component: web
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: li3d-web
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_HOST
              value: liclick-server
            - name: BACKEND_PORT
              value: "4517"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          # Raised alongside the server's 2026-09-10 OOM fix. This container has
          # never been OOMKilled — it sits at ~47Mi of the old 256Mi — so this is
          # headroom, not a fix for an observed failure. What it buys: nginx
          # fronts /api/ with `client_max_body_size 256m` and `proxy_buffering
          # off`, so a burst of concurrent large uploads or streamed responses
          # spends memory per connection, and the old ceiling left little room
          # before the kernel would have started killing pods here too.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
