apiVersion: apps/v1
kind: Deployment
metadata:
  name: li3d-web
  labels:
    app: li3d
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: li3d
      component: web
  template:
    metadata:
      labels:
        app: li3d
        component: web
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: li3d-web
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_HOST
              value: liclick-server
            - name: BACKEND_PORT
              value: "4517"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
