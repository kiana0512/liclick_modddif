apiVersion: apps/v1
kind: Deployment
metadata:
  name: liclick-server
  labels:
    app: li3d
    component: server
spec:
  replicas: 1
  # Retain the existing RWO volume for managed Atlas homes and temporary files.
  # Project documents and binary assets use PostgreSQL and object storage.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: li3d
      component: server
  template:
    metadata:
      labels:
        app: li3d
        component: server
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
      initContainers:
        # Keep the name so CI updates this and the server to the same SHA.
        - name: db-push
          image: li3d-server
          command: ["sh", "-c", "node deploy/validate-runtime-env.mjs && node apps/server/scripts/migrate-cloud-projects.mjs"]
          envFrom:
            - configMapRef:
                name: li3d-server-config
            - secretRef:
                name: li3d-server-secrets
            # Object storage AK/SK. Separate from li3d-server-secrets on
            # purpose: that one is regenerated from CI/CD variables on every
            # deploy, this one is created once directly in the cluster so the
            # keys never pass through git or CI. See
            # deploy/k8s/infra/object-storage-ingress/README.md.
            - secretRef:
                name: li3d-object-storage
          volumeMounts:
            - name: workspace
              mountPath: /data/workspace
      containers:
        - name: server
          image: li3d-server
          ports:
            - name: http
              containerPort: 4517
          envFrom:
            - configMapRef:
                name: li3d-server-config
            - secretRef:
                name: li3d-server-secrets
            # Object storage AK/SK. Separate from li3d-server-secrets on
            # purpose: that one is regenerated from CI/CD variables on every
            # deploy, this one is created once directly in the cluster so the
            # keys never pass through git or CI. See
            # deploy/k8s/infra/object-storage-ingress/README.md.
            - secretRef:
                name: li3d-object-storage
          volumeMounts:
            - name: workspace
              mountPath: /data/workspace
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          # OOMKilled at the old 1Gi limit on 2026-09-10 (exit 137) after ~1h43m
          # of local-repaint traffic. The memory is not V8 heap — Node had sized
          # heap_size_limit to 524Mi from that cgroup and was nowhere near it —
          # it's Buffers: this process holds whole images in memory while
          # proxying ModelView inpaint and asset-service traffic (each repaint
          # round trip is a handful of MB in, ~1.3MB out, and
          # ASSET_SERVICE_MAX_UPLOAD_BYTES allows far larger artifacts). Buffers
          # are external to the heap, so V8's own limit can't cap them and the
          # cgroup is what has to give. Raising the limit also lets Node scale
          # heap_size_limit up with it.
          # Idle usage is ~400Mi; requests stay well under the limit on purpose
          # so the burst is absorbed by node headroom (prod-worker-06 is at 64%
          # of 125Gi requested) rather than being reserved permanently.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: li3d-server-workspace
