apiVersion: apps/v1
kind: Deployment
metadata:
  name: liclick-server
  labels:
    app: li3d
    component: server
spec:
  replicas: 1
  # Retain the existing RWO volume for managed Atlas homes and temporary files.
  # Project documents and binary assets use PostgreSQL and object storage.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: li3d
      component: server
  template:
    metadata:
      labels:
        app: li3d
        component: server
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
      initContainers:
        # Keep the name so CI updates this and the server to the same SHA.
        - name: db-push
          image: li3d-server
          command: ["sh", "-c", "node deploy/validate-runtime-env.mjs && node apps/server/scripts/migrate-cloud-projects.mjs"]
          envFrom:
            - configMapRef:
                name: li3d-server-config
            - secretRef:
                name: li3d-server-secrets
            # Object storage AK/SK. Separate from li3d-server-secrets on
            # purpose: that one is regenerated from CI/CD variables on every
            # deploy, this one is created once directly in the cluster so the
            # keys never pass through git or CI. See
            # deploy/k8s/infra/object-storage-ingress/README.md.
            - secretRef:
                name: li3d-object-storage
          volumeMounts:
            - name: workspace
              mountPath: /data/workspace
      containers:
        - name: server
          image: li3d-server
          ports:
            - name: http
              containerPort: 4517
          envFrom:
            - configMapRef:
                name: li3d-server-config
            - secretRef:
                name: li3d-server-secrets
            # Object storage AK/SK. Separate from li3d-server-secrets on
            # purpose: that one is regenerated from CI/CD variables on every
            # deploy, this one is created once directly in the cluster so the
            # keys never pass through git or CI. See
            # deploy/k8s/infra/object-storage-ingress/README.md.
            - secretRef:
                name: li3d-object-storage
          volumeMounts:
            - name: workspace
              mountPath: /data/workspace
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          # Sized 4 CPU / 8Gi. Two different OOMs got us here, and they are not
          # the same failure:
          #   2026-09-10, 1Gi limit: OOMKilled by the kernel (exit 137). The
          #     memory was Buffers, outside the V8 heap — whole images held in
          #     memory while proxying ModelView inpaint and asset-service
          #     traffic. V8's own limit cannot cap those, so the cgroup had to
          #     give. Raised to 4Gi.
          #   2026-09-16, 4Gi limit: V8 heap exhaustion (exit 134, SIGABRT,
          #     "Reached heap limit"), crash-looping ~92s after every boot. Node
          #     had auto-sized heap_size_limit to ~2Gi from the 4Gi cgroup, and
          #     Mark-Compact freed almost nothing (2075 -> 2072 MB), i.e. ~2Gi of
          #     live, reachable objects. Root cause not yet identified; see
          #     NODE_OPTIONS in server-config.env for the heap split.
          # Idle usage is ~50-400Mi, so this is headroom for bursts, not steady
          # state. Requests stay well under the limit on purpose — the burst is
          # absorbed by node headroom rather than reserved permanently.
          resources:
            requests:
              cpu: 1
              memory: 1Gi
            limits:
              cpu: 4
              memory: 8Gi
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: li3d-server-workspace
