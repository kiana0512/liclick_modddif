apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Point at your real registry + tag per release, e.g. from CI:
#   kubectl kustomize k8s/overlays/prod | sed ... or use `cd k8s/overlays/prod && kustomize edit set image ...`
images:
  - name: li3d-server
    newName: registry.example.com/li3d/server
    newTag: 0.1.3
  - name: li3d-web
    newName: registry.example.com/li3d/web
    newTag: 0.1.3

patches:
  - path: server-patch.yaml
  - path: web-patch.yaml
  - path: ingress-patch.yaml
